name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Shell syntax
        run: bash -n deploy.sh
      - name: Checker script syntax
        run: node --check scripts/check-workflows.js
      - name: Compose file is valid
        run: CORE_ADMIN_TOKEN=ci-dummy docker compose -f docker-compose.yml config --quiet
      - name: No admin token committed
        run: |
          if git grep -nE 'CORE_ADMIN_TOKEN=[A-Za-z0-9_-]{20,}'; then
            echo "::error::an admin token is committed in the repository"
            exit 1
          fi
          echo "No admin token committed"
