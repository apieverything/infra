name: api-everything

# Full local stack: 3 connectors (internal only), the core gateway and the
# static site. Only the gateway and the site are exposed to the host — exactly
# like production: clients never talk to a connector directly.
#
# Driven by ./deploy.sh, which generates .deploy/.env (random admin token).

services:
  instagram:
    build: ./connectors/socials/instagram
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      NO_COLOR: "1"
      IG_PROXY_URL: ""
      IG_PROXIES: ""
      IG_PROXY_CHECK: "0"
    networks: [ae]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  linkedin:
    build: ./connectors/socials/linkedin
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      NO_COLOR: "1"
      LI_PROXY_URL: ""
      LI_PROXIES: ""
      LI_PROXY_CHECK: "0"
    networks: [ae]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  tiktok:
    build: ./connectors/socials/tiktok
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      NO_COLOR: "1"
      TT_PROXY_URL: ""
      TT_PROXIES: ""
      TT_PROXY_CHECK: "0"
    networks: [ae]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  core:
    build: ./core
    restart: unless-stopped
    ports:
      - "${CORE_PORT:-9100}:9000"
    environment:
      PORT: "9000"
      HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      NO_COLOR: "1"
      CORE_ADMIN_TOKEN: "${CORE_ADMIN_TOKEN:?set via ./deploy.sh}"
      CORE_UPSTREAMS: '{"instagram":"http://instagram:3000","linkedin":"http://linkedin:3000","tiktok":"http://tiktok:3000"}'
      CORE_STORE: "file"
      CORE_DATA_DIR: "/app/.data"
      CORE_STARTER_CREDITS: "${CORE_STARTER_CREDITS:-100}"
      CORE_SIGNUP_PER_HOUR: "${CORE_SIGNUP_PER_HOUR:-50}"
      CORE_MAX_API_KEYS: "${CORE_MAX_API_KEYS:-20}"
      CORE_RATE_PER_MIN: "120"
    volumes:
      - core-data:/app/.data
    depends_on:
      instagram: { condition: service_healthy }
      linkedin: { condition: service_healthy }
      tiktok: { condition: service_healthy }
    networks: [ae]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8180}:80"
    volumes:
      # Generated by deploy.sh so the dashboard points at the local gateway,
      # without modifying the repository's public (empty) config.
      - ./.deploy/config.js:/usr/share/nginx/html/assets/config.js:ro
    depends_on:
      core: { condition: service_healthy }
    networks: [ae]

volumes:
  core-data:

networks:
  ae:
